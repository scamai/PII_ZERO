[pytest]
testpaths = tests

markers =
    fast: pure-Python tests, no ML imports (<5s total)
    slow: loads torch/spacy/paddle/presidio — run in CI or Docker only
    subprocess: run in a fresh interpreter to avoid C-extension conflicts

# Exclude test_regex_patterns.py from default collection.
# It has a module-level pytest.importorskip("presidio_analyzer") that fires
# during collection and loads presidio → spacy → torch, corrupting OpenSSL
# state and causing a segfault in cryptography.fernet later in the same run.
# To run NER pattern tests explicitly: pytest tests/test_regex_patterns.py
addopts = --ignore=tests/test_regex_patterns.py
